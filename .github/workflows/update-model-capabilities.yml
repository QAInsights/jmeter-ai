name: Update model capabilities

# Refreshes the vendored models.dev capability file on a schedule and opens a
# PR with the diff. The vendored file is the reviewable pin - nothing is
# fetched at runtime.
on:
  schedule:
    # Daily, 06:00 UTC - provider catalogs move fast (new models gain
    # Thinking/effort controls and pricing metadata within a day of release)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Refresh vendored capabilities
        run: ./scripts/update-model-capabilities.sh

      - name: Check for changes
        id: changes
        run: |
          git add src/main/resources/org/qainsights/jmeter/ai/reasoning/model-capabilities.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/model-capabilities-$(date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore: refresh vendored models.dev capabilities"
          git push -u origin "$branch"
          gh pr create \
            --title "chore: refresh vendored models.dev capabilities" \
            --body 'Automated daily refresh of `src/main/resources/org/qainsights/jmeter/ai/reasoning/model-capabilities.json` from https://models.dev/api.json (via `scripts/update-model-capabilities.sh`).

          Review the diff like any dependency bump: new models gain Thinking/effort controls, removed/retired models lose them.'
