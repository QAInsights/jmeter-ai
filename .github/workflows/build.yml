name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install virtual display and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk

      - name: Build and test
        run: xvfb-run -a mvn -B -ntp verify -Dgpg.skip

      - name: Cache JMeter 5.6.3
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apache-jmeter-5.6.3
          key: apache-jmeter-5.6.3

      - name: Install JMeter 5.6.3
        run: |
          if [ ! -x "$JMETER_HOME/bin/jmeter" ]; then
            mkdir -p "$JMETER_HOME"
            curl -fsSL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz \
              | tar -xz --strip-components=1 -C "$JMETER_HOME"
          fi
        env:
          JMETER_HOME: ${{ runner.temp }}/apache-jmeter-5.6.3

      - name: Smoke test shaded JAR
        run: scripts/smoke-shaded-jar.sh
        env:
          JMETER_HOME: ${{ runner.temp }}/apache-jmeter-5.6.3

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
