# Feather Wand quick start
#
# 1. Paste this file into JMeter's bin/user.properties.
# 2. Pick ONE option below: remove the leading # from its lines and fill in your key.
# 3. Restart JMeter and open Feather Wand from the toolbar.
#
# Every other setting already has a sensible default. When you want to tune
# models, gateways, Agent Mode or the AI terminal, see jmeter-ai-sample.properties
# or the Configuration section of the README.

# Option A: Claude (Anthropic) - https://console.anthropic.com/
#jmeter.ai.service.type=anthropic
#anthropic.api.key=YOUR_ANTHROPIC_API_KEY

# Option B: OpenAI - https://platform.openai.com/api-keys
#jmeter.ai.service.type=openai
#openai.api.key=YOUR_OPENAI_API_KEY

# Option C: free and local with Ollama - https://ollama.com/
# Run `ollama pull llama3.1` first. No API key needed.
#jmeter.ai.service.type=ollama
#ollama.default.model=llama3.1

# Gemini, DeepSeek, Grok, AWS Bedrock, corporate gateways and the Codex /
# Claude Code subscription CLIs are configured in jmeter-ai-sample.properties.

# Feather Wand sends one anonymous usage ping per day (no prompts, keys or test
# plan content). Uncomment to turn it off.
#jmeter.ai.telemetry.enabled=false
