jmeter.ai.streaming.enabled=true
# Show AI Dev tool-exercise items under the Run menu (default: false).
# Enable only when debugging agent tools (add/update/delete/toggle/move).
# Takes effect on JMeter restart.
jmeter.ai.dev.menu=false
##### AGENT MODE SETTINGS #####
# Agent Mode lets the AI autonomously edit your test plan through 18 tools.
# Supports API-backed Claude, OpenAI, and Google Gemini, plus the optional
# ChatGPT/Codex and Claude Code CLI providers configured below.
# Other providers fall back to plain chat.
# Enable agent mode (default: false)
jmeter.ai.agent.enabled=false
# Max tokens per agent response (default: 4096)
jmeter.ai.agent.max.tokens=4096
# Max reason-act iterations per request (default: 8)
jmeter.ai.agent.max.iterations=8
# Show confirmation dialog before destructive operations (delete/move/open_plan/apply_correlation)
# Set to false to skip confirmations (default: true)
jmeter.ai.agent.confirm.destructive=true
# Recommended: enable JMeter's Undo/Redo so agent changes can be reversed with Ctrl+Z
# JMeter defaults this to 0 (disabled). Uncomment and set to enable:
# undo.history.size=50
# Feather Wand - JMeter AI Plugin Configuration
##### CORRELATION ENGINE - DYNAMIC VALUE DETECTION #####
# The Correlation Engine replays your test plan with 1 thread/1 iteration,
# captures live responses, and detects dynamic values that need correlation.
# Configure the patterns below to match your application's dynamic tokens.

# Known token names to detect (comma-separated, case-insensitive).
# These are matched in Set-Cookie headers, JSON keys, form fields, and URL parameters.
jmeter.ai.correlation.known_tokens=JSESSIONID,jsessionid,sessionId,_sourcePage,__fp,_token,csrf,access_token,id_token,code,state,nonce

# Custom regex patterns for detecting dynamic values.
# Format: name::regex  (one per line, increment the index)
# The name becomes the token type shown in the Studio.
jmeter.ai.correlation.custom.1=uuid::[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}
jmeter.ai.correlation.custom.2=jwt::[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}
jmeter.ai.correlation.custom.3=hex::[0-9a-fA-F]{16,}

# Values to exclude from detection (comma-separated).
# These are common static values that should never be correlated.
jmeter.ai.correlation.exclude_values=true,false,null,undefined,application/json,text/html,utf-8,en-us

# Minimum length for a value to be considered dynamic (default: 3)
jmeter.ai.correlation.min_value_length=3

# Minimum entropy for auto-detected values (0.0-8.0, default: 2.8)
# Higher values require more randomness. Set to 0 to disable entropy-based detection.
jmeter.ai.correlation.min_entropy=2.8

##### CHAT UI AND MODEL PICKER #####
# The redesigned chat UI needs no dedicated properties. It follows JMeter's
# active light/dark look-and-feel and UI scaling. The selected model uses normal
# body-sized text; the responsive composer keeps model/reasoning controls,
# attachments, history navigation, context/cost status, and Send/Stop together.
# Enter sends; Shift+Enter inserts a newline. IME composition is respected.
#
# The model picker searches model names, providers, and raw prefixed ids. Rows
# show context, price, vision, and thinking metadata when known. Models are
# ordered pinned -> recent -> alphabetical. Pins, the eight most recent models,
# and custom subscription model ids persist in ~/.jmeter-ai/model-selector.json.
# These UI behaviors have no configuration property.

##### SUBSCRIPTION CLI PROVIDERS (CHAT + AGENT MODE) #####
# These optional providers drive your locally installed Codex / Claude Code CLI
# as the Feather Wand chat and Agent Mode backend. They are separate from the
# jmeter.ai.terminal.* settings, which control the interactive terminal tab.
#
# The CLI owns authentication and browser login. Feather Wand only runs the
# CLI's status/login/logout commands and never reads or stores its credentials.
# A CLI may report a subscription, API-key, or supported cloud login.
# Both providers are hidden until enabled; restart JMeter after enabling one.

# ChatGPT / Codex (requires the `codex` CLI).
jmeter.ai.codex.enabled=false
# Full path to the codex binary; empty discovers it on PATH. The picker footer's
# Refresh action clears cached discovery, useful after installing the CLI.
jmeter.ai.codex.executable=
# Hard timeout for one `codex exec` request and for the browser login flow.
jmeter.ai.codex.timeout.seconds=120
jmeter.ai.codex.login.timeout.seconds=300
# Comma-separated raw model ids added beside codex:default (do not add codex:).
# Empty means only the CLI default. The picker footer's Custom model action can
# add and remember an id immediately without a properties edit or restart.
jmeter.ai.codex.models=
# Sandbox passed directly to `codex exec`: read-only, workspace-write, or
# danger-full-access. read-only is the production-safe default.
jmeter.ai.codex.sandbox=read-only

# Claude Code (requires the `claude` CLI).
jmeter.ai.claudecode.provider.enabled=false
# Full path to the claude binary; empty discovers it on PATH.
jmeter.ai.claudecode.executable=
# Hard timeout for one `claude -p` request and for the browser login flow.
jmeter.ai.claudecode.timeout.seconds=120
jmeter.ai.claudecode.login.timeout.seconds=300
# Comma-separated raw model ids added beside claude-code:default (do not add
# claude-code:). Empty means only the CLI default; Custom model also works here.
jmeter.ai.claudecode.models=

# Most recent user/assistant conversation entries replayed with each one-shot
# CLI plain-chat request (effective minimum: 1). CLI answers arrive as one chunk,
# not token-by-token; Stop interrupts and terminates the child process.
jmeter.ai.cli.max.history.size=10
# Agent Mode uses the same 18 tools through a prompt-level JSON protocol. The
# normal destructive-tool confirmations still apply. Thinking/effort controls
# do not override the CLI's own reasoning settings.

