# ------------------------------------------------
# JMeter Pet (Feather Wand companion)
# ------------------------------------------------
# Show an animated pet in the bottom-right corner of the JMeter window.
# The pet reacts to test runs: excited on start, working while running,
# frowning on sampler failures, and celebrating clean runs. Drag it anywhere.
jmeter.pet.enable=false
# Which pet to show: quill, glim, peacock, or monkey
jmeter.pet.name=quill
# Render scale (0.25 - 2.0); 0.5 shows the pet at about 96x104 pixels
jmeter.pet.scale=0.5
