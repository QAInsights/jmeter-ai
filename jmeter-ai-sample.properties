# Thinking / Reasoning (shared across providers)
# Master default for the "Thinking" toggle shown next to the model selector
# for thinking-capable models (Claude 3.7/4.x, gpt-5.x, Gemini 2.5/3, Ollama,
# Bedrock Claude). The toolbar toggle overrides this at runtime.
jmeter.ai.thinking.enabled=false
# Default reasoning effort: low, medium, or high (gpt-5 also accepts minimal;
# gpt-5.x also accepts none). The toolbar effort dropdown overrides this.
jmeter.ai.thinking.effort=medium
# Optional: Anthropic thinking budget per effort level, in tokens
# (used for Claude 3.7/4.x first-party and Claude on Bedrock; max_tokens is bumped above it.
#  Claude 5 "fable" models use adaptive thinking + output_config effort instead - no budget.)
#anthropic.thinking.budget.low=2048
#anthropic.thinking.budget.medium=8192
#anthropic.thinking.budget.high=16384
#anthropic.thinking.budget.xhigh=24576
#anthropic.thinking.budget.max=32768

# Optional: agent-mode-only reasoning effort (low, medium, high, xhigh, max).
# Agent loops pay the thinking budget on EVERY iteration, so this lets loops
# run cheaper than the chat. Empty = follow the toolbar selection.
#jmeter.ai.agent.thinking.effort=

# Meta Muse reasoning summary verbosity: auto (default), concise, or detailed.
# "detailed" yields a fuller Thoughts card, even at lower effort levels.
#meta.reasoning.summary=auto

# File attachments (paperclip / drag-drop / paste in the chat):
# Processing mode per file: smart (default; digests for .jtl results and logs)
# or raw (head+tail excerpt). Click a chip in the UI to switch per file.
#jmeter.ai.file.mode=smart
# Character budget for excerpts/digests (default 50000).
#jmeter.ai.file.max.chars=50000
# Max attachments per message (default 3). Files must be UTF-8 text, up to 10 MB.
#jmeter.ai.file.max.count=3

# Conversation persistence: every chat is autosaved to ~/.jmeter-ai/sessions/
# (one JSON file per conversation, attachments included). The "Export" menu in
# the chat header writes Markdown or HTML for test reports.
# NOTE: sessions are stored UNENCRYPTED, including the full text of attached
# logs/results - avoid attaching files that contain credentials or secrets.
# Restore the last conversation automatically when the chat panel opens
# (default false):
#jmeter.ai.session.restore=true

# Prompt library: type @prompts in the chat input to browse six built-in
# starter prompts plus your own saved ones (click "Save prompt" on any of your
# messages). In the picker: Enter inserts the prompt text for editing, Del
# deletes one of your prompts, F2 edits/renames it (built-ins offer
# "Save as copy" instead). User prompts are stored UNENCRYPTED in
# ~/.jmeter-ai/prompts.json - don't save prompts containing credentials.
# Override the file location (e.g. portable installs):
#jmeter.ai.prompts.file=/path/to/prompts.json

# Browser Recording (off by default). Enables the recording control panel in
# the chat: capture browser traffic through JMeter's proxy recorder into a
# Recording Controller, then finalize into a test plan.
jmeter.ai.record.enabled=true
# Optional: where recording artifacts are stored (empty = java.io.tmpdir/jmeter-ai-recordings,
# e.g. C:\Users\<you>\AppData\Local\Temp\jmeter-ai-recordings on Windows).
jmeter.ai.record.artifacts.dir=
# Optional: days to keep artifacts before cleanup (default 7).
jmeter.ai.record.retention.days=7
# Optional: think-time injection into recorded plans (scale 1.0 = as-recorded,
# clamped to min/max milliseconds).
jmeter.ai.record.think_time.scale=1.0
jmeter.ai.record.think_time.min.ms=0
jmeter.ai.record.think_time.max.ms=10000
# Optional: cap on browser tool output fed back to the model mid-recording
# (empty = 8000 chars, ~2000 tokens; invalid values fall back to the default).
jmeter.ai.record.tool.output.max.chars=

# Ollama Configuration
# Set to 'ollama' to use Ollama
# You must set the right model name for the AI service you choose
# Please refer to the documentation of the AI service you choose to find the right model name
ollama.default.model=llama3.1
ollama.host=http://localhost
ollama.port=11434
ollama.temperature=0.5
ollama.max.history.size=10
# Ollama thinking mode: ENABLED or DISABLED (default: DISABLED)
# Note: this now acts as the DEFAULT for the toolbar "Thinking" toggle -
# once you change the toggle in the UI, the UI choice wins for the session.
ollama.thinking.mode=DISABLED
# Ollama thinking level: LOW, MEDIUM, or HIGH (default: MEDIUM)
# Only used when ollama.thinking.mode is ENABLED and no UI effort was chosen
ollama.thinking.level=LOW
# Ollama request timeout in seconds (default: 120)
# Increase this value when using thinking mode, as inference takes longer
ollama.request.timeout.seconds=120
ollama.system.prompt=
You are a JMeter expert assistant embedded in a JMeter plugin called 'Feather Wand - JMeter Agent'. \

# DeepSeek Configuration
# DeepSeek API Key (required)
deepseek.api.key=YOUR_DEEPSEEK_API_KEY
# API format: 'openai' (default) or 'anthropic'
# OpenAI format uses: https://api.deepseek.com
# Anthropic format uses: https://api.deepseek.com/anthropic
deepseek.api.format=openai
# Base URL (automatically set based on format, override if needed)
# deepseek.base.url=https://api.deepseek.com
# Default model: deepseek-chat or deepseek-reasoner
deepseek.default.model=deepseek-chat
deepseek.temperature=0.7
deepseek.max.tokens=4096
deepseek.max.history.size=10
