# AWS Bedrock Configuration
# AWS Bedrock provides managed inference for Anthropic Claude models (and others).
# See: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages.html
# Authentication options (in priority order):
#   1. bedrock.api.key - Bedrock API key (bearer token), generated from Bedrock console -> API keys
#      See: https://docs.aws.amazon.com/bedrock/latest/userguide/api-keys.html
#   2. bedrock.aws.access.key + bedrock.aws.secret.key - IAM access keys
#   3. Default credential chain (env vars, IAM role, shared credentials file, etc.)
bedrock.api.key=
bedrock.aws.access.key=
bedrock.aws.secret.key=
bedrock.aws.region=us-east-1
bedrock.default.model=anthropic.claude-3-5-sonnet-20241022-v2:0
bedrock.model.providers=Anthropic
bedrock.temperature=0.5
bedrock.max.tokens=4096
bedrock.max.history.size=10
bedrock.system.prompt=You are a JMeter expert assistant embedded in a JMeter plugin called 'Feather Wand - JMeter Agent'. \
